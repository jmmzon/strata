[package]
name = "strata-term"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Strata's embedded terminal core on libghostty-vt, with no interface toolkit"
publish = false

[lints]
workspace = true

[dependencies]
# vt-1.0.2 bindings from libghostty-rs master; the 0.2.x releases bind a
# pre-1.0 Ghostty whose C API is incompatible. `pkg-config` links the library
# Nix builds from the pinned Ghostty source instead of cloning it in build.rs.
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "4466c0f45f51f964f86d1974a50502dbec7cb0de", features = ["pkg-config"] }
rustix = { workspace = true, features = ["pty", "termios"] }

[dev-dependencies]
tempfile.workspace = true
